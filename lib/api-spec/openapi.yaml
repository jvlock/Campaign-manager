        durationMinutes: {type: integer, minimum: 1, maximum: 1440}
        timezone: {type: string}
        platform: {type: string}
        speakers:
          type: array
          items: {$ref: "#/components/schemas/Speaker"}
        registrationRule: {$ref: "#/components/schemas/RegistrationRule"}
        recruitmentLaunchAt: {type: string, format: date-time}
        channel:
          oneOf:
            - {$ref: "#/components/schemas/GovernedChannelId"}
            - type: "null"
    WebinarPerson:
      type: object
