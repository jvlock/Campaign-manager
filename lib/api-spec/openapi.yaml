          type: boolean
          enum: [true]
        governance: {$ref: "#/components/schemas/ProvisionalGovernanceMetadata"}
        isDeprecated: {type: boolean}
        deprecatedAt: {type: string, format: date-time, nullable: true}
        deprecationReason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaxonomyTermsResponse:
      type: object
      required: [version, versionId, categories, terms, governance]
