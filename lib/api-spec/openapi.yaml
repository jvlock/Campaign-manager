      type: object
      required: [required, satisfiedOperational, unsatisfiedOperational, unknownOperational, diagnosticOperationalGaps]
      description: "The required set is the canonical COMPLETE_OBLIGATIONS constant. Only names in the last completionResult.operationalGaps are classified unsatisfied; all remaining names are unknown, never inferred satisfied from absence. Without a snapshot every required obligation is unknown."
