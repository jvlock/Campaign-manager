      type: object
      required: [batch, candidates]
      properties:
        batch: {type: object, additionalProperties: true}
        candidates:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyImportCandidate"}
        idempotent: {type: boolean}
    TaxonomyImportCandidate:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          description: >
            Provisional import workflow state returned by the API. Legacy
            approved rows are remapped to business_review_complete and do not
            represent governance approval.
          enum: [business_review_complete, rejected, staged, conflict, committed]
        metadata:
          type: object
          additionalProperties: true
          properties:
            businessReviewComplete:
              type: boolean
              description: Draft business review completion only; never governance approval or finality.
    TaxonomyImportReview:
      allOf:
        - {$ref: "#/components/schemas/GovernanceActorReason"}
        - type: object
          required: [status]
          properties:
            status:
              type: string
              description: >
                business_review_complete records provisional draft review.
                approved is retained only so typed callers receive the server's
                explicit quarantine rejection; it is never accepted as approval.
              enum: [business_review_complete, rejected, staged, conflict, approved]
            note: {type: string}
            resolveConflict: {type: boolean}
            payload: {type: object, additionalProperties: true}
