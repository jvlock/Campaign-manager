        required: {type: array, items: {type: string, enum: [attendanceReconciliation, requiredFollowUpCompletion, exceptionRecording, measurementCapture]}}
        satisfiedOperational: {type: array, items: {type: string}, description: "Always empty absent independently verified operational observations."}
        unsatisfiedOperational: {type: array, items: {type: string, enum: [attendanceReconciliation, requiredFollowUpCompletion, exceptionRecording, measurementCapture]}, description: "Only canonical names explicitly present in the completion result's operationalGaps; no snapshot means empty."}
        unknownOperational: {type: array, items: {type: string, enum: [attendanceReconciliation, requiredFollowUpCompletion, exceptionRecording, measurementCapture]}, description: "Canonical names not explicitly present in operationalGaps; absence is not proof of satisfaction."}
        diagnosticOperationalGaps: {type: array, items: {type: string}}
