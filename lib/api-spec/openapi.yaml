        version: {type: string}
        versionId: {type: string, format: uuid}
        categories:
          type: array
          items: {type: string}
        terms:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyTerm"}
        governance: {$ref: "#/components/schemas/ProvisionalGovernanceMetadata"}
