      allOf:
        - {$ref: "#/components/schemas/GovernanceActorReason"}
        - type: object
          required: [recordType, recordId, stage, status, approver]
          properties:
            recordType: {$ref: "#/components/schemas/RecordType"}
            recordId: {type: string, format: uuid}
            stage: {type: string}
            status: {type: string}
            approver: {type: string}
    GovernanceApprovalUpdate:
      allOf:
        - {$ref: "#/components/schemas/GovernanceActorReason"}
