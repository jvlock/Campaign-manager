openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Campaign Operating Workspace API
servers:
  - url: /api
tags:
  - name: health
  - name: campaigns
  - name: delivery
  - name: planning
  - name: webinars
  - name: portfolio
  - name: governance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CampaignSummary"}
    post:
      operationId: createCampaign
      tags: [campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignInput"}
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignDetail"}
  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignDetail"}
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignDetail"}
  /campaigns/{id}/map:
    put:
      operationId: saveCampaignMap
      tags: [campaigns]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MapInput"}
      responses:
        "200":
          description: Saved map
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MapData"}
  /campaigns/{id}/activities:
    post:
      operationId: createActivity
      tags: [campaigns]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityInput"}
      responses:
        "201":
          description: Activity
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Activity"}
  /campaigns/{id}/delivery:
    get:
      operationId: getCampaignDelivery
      tags: [delivery]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Campaign delivery children
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignDelivery"}
  /campaigns/{id}/communications:
    post:
      operationId: createCommunication
      tags: [delivery]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommunicationInput"}
      responses:
        "201":
          description: Created communication
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Communication"}
  /campaigns/{id}/communications/{itemId}:
    patch:
      operationId: updateCommunication
      tags: [delivery]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ItemId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommunicationUpdate"}
      responses:
        "200":
          description: Updated communication
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Communication"}
    delete:
      operationId: deleteCommunication
      tags: [delivery]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ItemId"}
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /campaigns/{id}/tasks:
    post:
      operationId: createActivityTask
      tags: [delivery]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityTaskInput"}
      responses:
        "201":
          description: Created activity task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityTask"}
  /campaigns/{id}/tasks/{itemId}:
    patch:
      operationId: updateActivityTask
      tags: [delivery]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ItemId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityTaskUpdate"}
      responses:
        "200":
          description: Updated activity task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityTask"}
  /campaigns/{id}/schedule-rules:
    get:
      operationId: listScheduleRules
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Schedule rules
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScheduleRule"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createScheduleRule
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleRuleInput"}
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleRuleCreateResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /campaigns/{id}/schedule-rules/{ruleId}:
    patch:
      operationId: updateScheduleRule
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/RuleId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleRuleUpdate"}
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleRule"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deleteScheduleRule
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/RuleId"}
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /campaigns/{id}/scheduled-instances:
    get:
      operationId: listScheduledInstances
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Scheduled instances
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScheduledInstance"}
  /campaigns/{id}/schedule-rules/recompute:
    post:
      operationId: recomputeSchedule
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleRecomputeInput"}
      responses:
        "200":
          description: Recomputed instances
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScheduledInstance"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /campaigns/{id}/scheduled-instances/{instanceId}/adjust:
    patch:
      operationId: adjustScheduledInstance
      tags: [planning]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/InstanceId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduledInstanceAdjustment"}
      responses:
        "200":
          description: Adjusted instance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduledInstance"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /campaigns/{id}/webinars:
    get:
      operationId: listWebinars
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Webinar sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/WebinarSession"}
    post:
      operationId: createWebinar
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarInput"}
      responses:
        "201":
          description: Created webinar session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarSession"}
  /campaigns/{id}/webinars/{sessionId}:
    get:
      operationId: getWebinar
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200":
          description: Webinar session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarSession"}
    patch:
      operationId: updateWebinar
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarUpdate"}
      responses:
        "200":
          description: Updated webinar session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarSession"}
  /campaigns/{id}/webinars/{sessionId}/people:
    get:
      operationId: listWebinarPeople
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200":
          description: Synthetic planning people
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/WebinarPerson"}
    post:
      operationId: createWebinarPerson
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyntheticPersonInput"}
      responses:
        "201":
          description: Synthetic planning person
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarPerson"}
  /campaigns/{id}/webinars/{sessionId}/people/{personId}/registration:
    post:
      operationId: recordWebinarRegistration
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/PersonId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationResultInput"}
      responses:
        "200":
          description: Evaluated planning branch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarEvaluation"}
  /campaigns/{id}/webinars/{sessionId}/people/{personId}/attendance:
    post:
      operationId: recordWebinarAttendance
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/PersonId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AttendanceResultInput"}
      responses:
        "200":
          description: Evaluated planning branch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarEvaluation"}
  /campaigns/{id}/webinars/{sessionId}/evaluation:
    get:
      operationId: evaluateWebinar
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200":
          description: Planning-only branch evaluation
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/WebinarEvaluation"}
  /campaigns/{id}/webinars/{sessionId}/evaluate:
    post:
      operationId: evaluateWebinarPerson
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebinarPersonEvaluationInput"
      responses:
        "200":
          description: Planning-only branch evaluation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarEvaluation"}
  /campaigns/{id}/webinars/{sessionId}/standard:
    get:
      operationId: getWebinarStandard
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200":
          description: Fixed nine-communication webinar standard
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarStandard"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateWebinarStandard
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarStandardPatch"}
      responses:
        "200":
          description: Updated standard copy and configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarStandard"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /campaigns/{id}/webinars/{sessionId}/standard/eligibility:
    get:
      operationId: getWebinarStandardEligibility
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200":
          description: Planning-only eligibility
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarStandardEligibility"}
  /campaigns/{id}/webinars/{sessionId}/standard/export:
    get:
      operationId: exportWebinarStandard
      tags: [webinars]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200":
          description: Deployable JSON for active variants only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarStandardExport"}
        "422":
          description: Active variant validation failure
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarStandardExportError"}
  /campaigns/{id}/utm-links:
    post:
      operationId: generateUtmLink
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UtmInput"}
      responses:
        "201":
          description: Generated link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UtmLink"}
  /campaigns/{id}/export/{format}:
    get:
      operationId: exportCampaign
      tags: [campaigns]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [activities-csv, utm-csv, json, plan]
      responses:
        "200":
          description: Export file
          content:
            text/plain:
              schema: {type: string}
  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Portfolio"}
  /conflicts/run:
    post:
      operationId: runConflictDetection
      tags: [portfolio]
      responses:
        "200":
          description: Conflict results
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Conflict"}
  /governance:
    get:
      operationId: getGovernance
      tags: [governance]
      responses:
        "200":
          description: Governance configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Governance"}
  /governance/audit:
    get:
      operationId: listGovernanceAudit
      tags: [governance]
      parameters:
        - name: entityType
          in: query
          schema: {type: string}
        - name: entityId
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500}
      responses:
        "200":
          description: Governance audit events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GovernanceAuditEvent"}
  /governance/terms:
    get:
      operationId: listGovernanceTerms
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/TaxonomyVersion"}
      responses:
        "200":
          description: Taxonomy terms
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTermsResponse"}
    post:
      operationId: createGovernanceTerm
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaxonomyTermMutation"}
      responses:
        "201":
          description: Created taxonomy term
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTerm"}
  /governance/terms/resolve:
    get:
      operationId: resolveGovernanceTerm
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/TaxonomyVersion"}
        - name: code
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Resolved taxonomy code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyResolution"}
    post:
      operationId: resolveGovernanceTermPost
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaxonomyResolveInput"}
      responses:
        "200":
          description: Resolved taxonomy code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyResolution"}
  /governance/terms/{id}:
    patch:
      operationId: updateGovernanceTerm
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaxonomyTermMutation"}
      responses:
        "200":
          description: Updated taxonomy term
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTerm"}
  /governance/terms/{id}/deprecate:
    post:
      operationId: deprecateGovernanceTerm
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GovernanceActorReason"}
      responses:
        "200":
          description: Deprecated taxonomy term
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTerm"}
  /governance/terms/{id}/rename:
    post:
      operationId: renameGovernanceTerm
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaxonomyTermMutation"}
      responses:
        "200":
          description: Renamed taxonomy term
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTerm"}
  /governance/imports:
    post:
      operationId: stageTaxonomyImport
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaxonomyImportInput"}
      responses:
        "201":
          description: Staged taxonomy import
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyImportBatchResponse"}
  /governance/imports/{batchId}:
    get:
      operationId: getTaxonomyImport
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/BatchId"}
      responses:
        "200":
          description: Import batch and candidates
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyImportBatchResponse"}
  /governance/imports/{batchId}/candidates/{candidateId}:
    patch:
      operationId: reviewTaxonomyImportCandidate
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/BatchId"}
        - {$ref: "#/components/parameters/CandidateId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaxonomyImportReview"}
      responses:
        "200":
          description: Reviewed import candidate
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyImportCandidate"}
  /governance/imports/{batchId}/commit:
    post:
      operationId: commitTaxonomyImport
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/BatchId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GovernanceActorReason"}
      responses:
        "200":
          description: Committed approved candidates
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyImportBatchResponse"}
  /governance/approvals:
    get:
      operationId: listGovernanceApprovals
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/RecordType"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          description: Polymorphic approvals
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GovernanceApproval"}
    post:
      operationId: createGovernanceApproval
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GovernanceApprovalInput"}
      responses:
        "201":
          description: Created approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GovernanceApproval"}
  /governance/approvals/{id}:
    patch:
      operationId: updateGovernanceApproval
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GovernanceApprovalUpdate"}
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GovernanceApproval"}
  /governance/comments:
    get:
      operationId: listGovernanceComments
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/RequiredRecordType"}
        - {$ref: "#/components/parameters/RequiredRecordId"}
      responses:
        "200":
          description: Polymorphic comments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GovernanceComment"}
    post:
      operationId: createGovernanceComment
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GovernanceCommentInput"}
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GovernanceComment"}
  /governance/comments/{id}:
    patch:
      operationId: updateGovernanceComment
      tags: [governance]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GovernanceCommentUpdate"}
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
