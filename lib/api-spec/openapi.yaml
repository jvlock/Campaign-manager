      properties:
        id: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        category: {type: string}
        label: {type: string}
        shortcode: {type: string}
        stableKey: {type: string, nullable: true}
        parentId: {type: string, format: uuid, nullable: true}
        supersededBy: {type: string, format: uuid, nullable: true}
        legacyCodes:
          type: array
          items: {type: string}
        sourceMetadata:
          type: object
          additionalProperties: true
        source_environment:
          type: string
          enum: [development]
        verification_status:
          type: string
          enum: [provisional]
        publishing_eligible:
          type: boolean
          enum: [false]
        source_reference:
          type: string
          enum: ["Campaign Governance Foundation, migrated via audit"]
