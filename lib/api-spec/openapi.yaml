      allOf:
        - {$ref: "#/components/schemas/GovernanceActorReason"}
        - type: object
          required: [recordType, recordId, body]
          properties:
            recordType: {$ref: "#/components/schemas/RecordType"}
            recordId: {type: string, format: uuid}
            body: {type: string}
    GovernanceCommentUpdate:
      allOf:
        - {$ref: "#/components/schemas/GovernanceActorReason"}
        - type: object
          required: [body]
          properties:
            body: {type: string}
