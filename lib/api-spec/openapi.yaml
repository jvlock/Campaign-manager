      type: object
      required: [sessionId, people, externalSending]
      properties:
        sessionId: {type: string, format: uuid}
        people:
          type: array
          items: {$ref: "#/components/schemas/WebinarStandardEligibilityRow"}
        externalSending: {type: boolean, const: false}
    WebinarStandardExport:
      type: object
      required: [campaignId, sessionId, launchAt, communications]
      properties:
        campaignId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        launchAt: {type: [string, "null"], format: date-time}
        communications:
          type: array
          items:
            type: object
            required: [key, sortOrder, timing, audienceRule, variant]
            properties:
              key: {type: string}
              sortOrder: {type: integer}
              timing: {$ref: "#/components/schemas/WebinarStandardTiming"}
              audienceRule: {type: string}
              scheduled: {$ref: "#/components/schemas/WebinarStandardScheduled"}
              variant:
                allOf:
                  - {$ref: "#/components/schemas/WebinarStandardVariant"}
                  - type: object
                    required: [content]
                    properties:
                      content: {$ref: "#/components/schemas/WebinarStandardContent"}
