      type: object
      required: [personId, communicationKey, eligible, status, reason, attendanceResult]
      properties:
        personId: {type: string, format: uuid}
        communicationKey: {type: string}
        eligible: {type: boolean}
        status: {type: string}
        reason: {type: string}
        eligibleAt: {type: [string, "null"], format: date-time}
        registrationRecordedAt: {type: [string, "null"], format: date-time}
        attendanceResult: {type: [string, "null"], enum: [attended, no_show, null]}
