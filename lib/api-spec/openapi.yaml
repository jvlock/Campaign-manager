        eventDate: {type: string, format: date}
        eventTime: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        durationMinutes: {type: integer, minimum: 1, maximum: 1440}
        timezone: {type: string, description: IANA timezone}
        platform: {type: string, minLength: 1}
        speakers:
          type: array
          items: {$ref: "#/components/schemas/Speaker"}
          default: []
        recruitmentLaunchAt: {type: string, format: date-time, description: Webinar campaign launch instant}
        channel:
          oneOf:
            - {$ref: "#/components/schemas/GovernedChannelId"}
