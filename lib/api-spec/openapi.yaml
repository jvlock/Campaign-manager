components:
  headers:
    PopulationPage:
      description: 'JSON object with total (authorized scoped records), returned (this response), hasMore and nextOffset (null at end). Stable ID ordered live pages; restart on population changes. For composite objects each top-level collection receives the same limit/offset independently, totals/returned sum the collections. Generated client consumes all pages, rejects partial failures, and deduplicates by ID.'
      schema: {type: string}
  parameters:
    WebinarApiCampaignId: {name: campaignId, in: path, required: true, schema: {type: string, format: uuid}}
    WebinarApiSessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    SyntheticCampaignId: {name: campaignId, in: query, required: true, schema: {type: string, format: uuid}}
    SyntheticActivityId: {name: activityId, in: query, required: true, schema: {type: string, format: uuid}}
    SyntheticSessionId: {name: sessionId, in: query, required: true, schema: {type: string, format: uuid}}
    SyntheticLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    SyntheticOffset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    SyntheticFixtureAfter: {name: after, in: query, schema: {type: string, pattern: "^fixture-[0-9]{1,8}$"}}
    SyntheticPersonAfter: {name: after, in: query, schema: {type: string, format: uuid}}
    SyntheticAudienceBranchId: {name: audienceBranchId, in: query, schema: {type: string, format: uuid}, description: "Optional development branch filter, not an identity or group authorization assertion"}
    PageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    PageOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PersonId:
      name: personId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BatchId:
      name: batchId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaxonomyVersion:
      name: versionId
      in: query
      schema: {type: string, format: uuid}
    RecordType:
      name: recordType
      in: query
      schema: {type: string}
    RecordId:
      name: recordId
      in: query
      schema: {type: string, format: uuid}
    RequiredRecordType:
      name: recordType
      in: query
      required: true
      schema: {type: string}
    RequiredRecordId:
      name: recordId
      in: query
      required: true
      schema: {type: string, format: uuid}
  responses:
    WebinarApiValidationError:
      description: VALIDATION_ERROR; malformed scope, time, unknown request fields, untrusted identity or request over 16 KiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebinarApiError"}
          example: {error: {code: VALIDATION_ERROR, message: "Invalid scoped webinar API request"}}
    WebinarApiNotFound:
      description: NOT_FOUND; occurrence not in the selected campaign.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebinarApiError"}
          example: {error: {code: NOT_FOUND, message: "Webinar occurrence not found"}}
    WebinarApiConflict:
      description: CONFLICT or IDEMPOTENCY_CONFLICT (revision/key mismatch), STALE_INPUT, CAPABILITY_UNAVAILABLE (ineligible).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebinarApiError"}
          example: {error: {code: IDEMPOTENCY_CONFLICT, message: "Idempotency key does not match the original request"}}
    WebinarApiIncomplete:
      description: MISSING_REQUIRED_INPUT or EVALUATION_INCOMPLETE; caller must supply scoped evidence or evaluate the current revision.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebinarApiError"}
    WebinarApiUnauthorized:
      description: UNAUTHORIZED; trusted independent reviewer authorization does not exist in open development.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebinarApiError"}
          example: {error: {code: UNAUTHORIZED, message: "Exception review requires independently verified reviewer identity and authorization"}}
    WebinarApiUnavailable:
      description: CAPABILITY_UNAVAILABLE or INTERNAL_ERROR; nonoperational development server or storage is unavailable, without connection details.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebinarApiError"}
    AuthenticationUnavailable:
      description: Trusted authentication is not configured or cannot verify the request; protected operations are disabled (AUTHENTICATION_UNAVAILABLE).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OrganizationAccessError"}
          example: {error: {code: AUTHENTICATION_UNAVAILABLE, message: "Trusted authentication is unavailable; organizational operations are disabled."}}
    AuthenticationRequired:
      description: Verified authentication is required.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OrganizationAccessError"}
          example: {error: {code: authentication_required, message: "Verified authentication is required."}}
    ScopedOperationUnavailable:
      description: Legacy or otherwise unapproved operations are disabled, even for a verified principal (403).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OrganizationAccessError"}
          example: {error: {code: scoped_operation_unavailable, message: "This operation is not enabled by the organizational authorization foundation."}}
    RecordUnavailable:
      description: Record not found or not visible to the verified principal.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OrganizationAccessError"}
          example: {error: {code: record_unavailable, message: "Record unavailable."}}
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Concurrent update or duplicate
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    WebinarApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, UNAUTHENTICATED, UNAUTHORIZED, CAPABILITY_UNAVAILABLE, PROVIDER_NOT_CONFIGURED, PROVIDER_UNAVAILABLE, PROVIDER_RESPONSE_INVALID, UNSUPPORTED_GOVERNED_OUTPUT, STALE_INPUT, MISSING_REQUIRED_INPUT, EVALUATION_INCOMPLETE, INTERNAL_ERROR]}
            message: {type: string}
    WebinarApiEvaluationInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, idempotencyKey, calculationAt]
      properties:
        expectedRevision: {type: integer, minimum: 0, description: "Current scoped source revision, not a rule result."}
        idempotencyKey: {type: string, format: uuid, description: "Scoped to occurrence and evaluation; exact key and body must be reused on retry."}
        calculationAt: {type: string, format: date-time, description: "Fixed diagnostic instant accepted only on this isolated development route."}
    WebinarApiEvidenceInput:
      type: object
      additionalProperties: false
      required: [sourceId, evidenceType, sourceType, sourceVersion, sourceHash, expectedRevision, idempotencyKey, calculationAt]
      properties:
        sourceId: {type: string, format: uuid}
        evidenceType: {type: string, enum: [qa, manual-review, source-observation]}
        sourceType: {type: string, enum: [occurrence, content, foundation, delivery, measurement], description: "Exact type of scoped persisted available source; qa requires content or occurrence; manual-review requires content."}
        sourceVersion: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$", description: "Exact immutable source version; a changed version is STALE_INPUT."}
        sourceHash: {type: string, pattern: "^[a-f0-9]{64}$", description: "Exact immutable source content hash; changed hash is STALE_INPUT."}
        expectedRevision: {type: integer, minimum: 0}
        idempotencyKey: {type: string, format: uuid}
        calculationAt: {type: string, format: date-time}
    WebinarApiExceptionInput:
      type: object
      additionalProperties: false
      required: [ruleId, evidenceId, reasonCode, expectedRevision, idempotencyKey, calculationAt, expiresAt]
      properties:
        ruleId: {type: string, pattern: "^WEB-[A-Z0-9-]+$", description: "Must belong to canonical RULE_IDS; a currently failed blocking, exception-eligible rule. WEB-EXC-001 cannot exempt itself."}
        evidenceId: {type: string, format: uuid}
        reasonCode: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,119}$"}
        expectedRevision: {type: integer, minimum: 0}
        idempotencyKey: {type: string, format: uuid}
        calculationAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Must be after calculationAt.}
    WebinarApiEmptyReview: {type: object, additionalProperties: false, description: "Review has no available action; empty body only."}
    WebinarApiStandard:
      type: object
      required: [id, version]
      properties:
        id: {type: string, enum: [WEB-STANDARD-001]}
        version: {type: string}
    WebinarApiEngineRelease:
      type: object
      required: [digest, provenance]
      properties:
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        provenance:
          type: object
          required: [schemaVersion, mode, operational, standardId, standardVersion, canonicalDocuments, evaluatorRegistry, applicationRelease, dependencies]
          properties:
            schemaVersion: {type: integer, enum: [1]}
            mode: {type: string, enum: [open-development]}
            operational: {type: boolean, enum: [false]}
            standardId: {type: string, enum: [WEB-STANDARD-001]}
            standardVersion: {type: string}
            canonicalDocuments: {type: object, additionalProperties: {type: string, pattern: "^[a-f0-9]{64}$"}}
            evaluatorRegistry:
              type: object
              required: [digest, implementationHashes, coverage]
              properties:
                digest: {type: string}
                implementationHashes: {type: object, additionalProperties: {type: string}}
                coverage: {$ref: "#/components/schemas/WebinarApiEngineCoverage"}
            applicationRelease: {type: [string, "null"], description: "Actual 40-character Git commit, or null if unavailable; never fabricated."}
            dependencies: {type: object, additionalProperties: {type: string}}
    WebinarApiEngineCoverage:
      type: object
      required: [implemented, total, implementedRuleIds, unimplementedRuleIds]
      properties:
        implemented: {type: integer, enum: [106]}
        total: {type: integer, enum: [106]}
        implementedRuleIds: {type: array, items: {type: string}}
        unimplementedRuleIds: {type: array, items: {type: string}}
    WebinarApiCoverage:
      type: object
      required: [totalRuleCount, implementedRuleCount, missingEvaluatorCount, implementedRuleIds, missingEvaluatorRuleIds]
      properties:
        totalRuleCount: {type: integer}
        implementedRuleCount: {type: integer}
        missingEvaluatorCount: {type: integer}
        implementedRuleIds: {type: array, items: {type: string}}
        missingEvaluatorRuleIds: {type: array, items: {type: string}}
    WebinarApiSourceReference:
      type: object
      required: [sourceType, sourceId]
      properties:
        sourceType: {type: string}
        sourceId: {type: string}
        sourceHash: {type: string}
        sourceVersion: {type: string}
    WebinarApiMissingInput:
      type: object
      required: [field, reason, sourceReference]
      properties:
        field: {type: string}
        reason: {type: string}
        sourceReference:
          anyOf:
            - {$ref: "#/components/schemas/WebinarApiSourceReference"}
            - {type: "null"}
    WebinarApiFinding:
      type: object
      required: [mode, standardId, standardVersion, ruleId, rule, status, reason, participantId, evidence]
      properties:
        mode: {type: string, enum: [descriptive_only]}
        standardId: {type: string, enum: [WEB-STANDARD-001]}
        standardVersion: {type: string}
        ruleId: {type: string}
        rule:
          type: object
          required: [ruleId, ruleName, hierarchyLevel, trigger, expectedBehavior, primaryRuleType, evidenceBasis, readinessStage, validationMethod, exceptionEligible, exceptionEligibleNote, failureMessage, resolutionGuidance]
          properties:
            ruleId: {type: string}
            ruleName: {type: string}
            hierarchyLevel: {type: string}
            trigger: {type: string}
            expectedBehavior: {type: string}
            primaryRuleType: {type: string}
            evidenceBasis: {type: string}
            readinessStage: {type: string}
            validationMethod: {type: string}
            exceptionEligible: {type: boolean}
            exceptionEligibleNote: {type: [string, "null"]}
            failureMessage: {type: string}
            resolutionGuidance: {type: string}
        status: {type: string, enum: [pass, fail, not_applicable, evidence_unavailable, unimplemented]}
        reason: {type: string, enum: [satisfied, violation, condition_not_met, missing_evidence, invalid_context, not_implemented]}
        participantId: {type: [string, "null"]}
        evidence: {type: array, items: {type: string}}
    WebinarApiResolvedBlocker:
      type: object
      required: [ruleId, classification, originalFailure, exception]
      properties:
        ruleId: {type: string}
        classification: {type: string, enum: [resolvedByException]}
        originalFailure: {$ref: "#/components/schemas/WebinarApiFinding"}
        exception: {type: object, additionalProperties: true, description: "Exact exception disposition snapshot, not evidence or a planning draft."}
    WebinarApiReadinessIssue:
      type: object
      required: [code, ruleId, stage, message]
      properties:
        code: {type: string}
        ruleId: {type: [string, "null"]}
        stage: {type: [string, "null"]}
        message: {type: string}
    WebinarApiStage:
      type: object
      required: [stage, status, fullyEvaluated, assignedRuleIds, applicableRuleIds, evaluatedRuleIds, missingRuleIds, passes, notApplicable, failedBlockers, unassessedBlockers, unassessedAdvisories, failedNonBlocking, warnings, exceptionResolvedBlockers, unresolvedRuleIds, diagnosticCoveragePercent, issues, prerequisiteIssues]
      properties:
        stage: {type: string, enum: [Ready to recruit, Ready to run, Ready to follow up, Complete]}
        status: {type: string, enum: [ready, blocked, incomplete]}
        fullyEvaluated: {type: boolean}
        assignedRuleIds: {type: array, items: {type: string}}
        applicableRuleIds: {type: array, items: {type: string}}
        evaluatedRuleIds: {type: array, items: {type: string}}
        missingRuleIds: {type: array, items: {type: string}}
        passes: {type: array, items: {$ref: "#/components/schemas/WebinarApiFinding"}}
        notApplicable: {type: array, items: {$ref: "#/components/schemas/WebinarApiFinding"}}
        failedBlockers: {type: array, items: {$ref: "#/components/schemas/WebinarApiFinding"}}
