openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Campaign Operating Workspace API
x-access-policy: "Restricted is the default: trusted authentication and scoped authorization required. Explicit isolated open-development enables only allowlisted planning routes; attribution is unverified and operational actions remain blocked. /healthz and /development/status are public."
servers:
  - url: /api
tags:
  - name: health
  - name: organization
  - name: campaigns
  - name: delivery
  - name: planning
  - name: webinars
  - name: portfolio
  - name: governance
paths:
  /campaigns/{campaignId}/webinars/{sessionId}/standard/summary:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardSummary
      tags: [webinars]
      description: "Development-only isolated synthetic webinar summary. A complete evaluator registry is not operational readiness. Source revision and fingerprint determine staleness; the Foundation is not connected to production."
      x-authorization: open-development-only; unverified synthetic actor; no operational authority
      responses:
        "200":
          description: Consistent occurrence-scoped source and immutable snapshot projection; taxonomy is synthetic-only.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiSummary"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/evaluations:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardEvaluations
      tags: [webinars]
      description: Development-only read of the last immutable synthetic evaluation; never runs an evaluator.
      x-authorization: open-development-only
      responses:
        "200":
          description: Ordered results or explicit not_evaluated status; source revision and fingerprint determine staleness.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiEvaluations"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
    post:
      operationId: evaluateWebinarStandard
      tags: [webinars]
      description: "Isolated development diagnostic simulation. Fixed calculationAt/expectedRevision/idempotencyKey tuple must be reused unchanged on retry. The sole orchestration evaluates all 106 canonical rules and persists an immutable snapshot; not operational approval."
      x-authorization: open-development-only; server-derived unverified actor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarApiEvaluationInput"}
            example: {expectedRevision: 3, idempotencyKey: "1bef1faf-47a0-42c4-823f-cc0e980a913c", calculationAt: "2026-09-24T12:00:00.000Z"}
      responses:
        "200":
          description: Immutable, complete synthetic snapshot; idempotent same-key/same-request replay returns the prior result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiEvaluationResult"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
        "413": {$ref: "#/components/responses/WebinarApiValidationError"}
        "503": {$ref: "#/components/responses/WebinarApiUnavailable"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/readiness:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardReadiness
      tags: [webinars]
      description: "Development-only last snapshot. Stages are independent per canonical dependencies; ready-to-run does not inherit ready-to-recruit. Incomplete inputs, failed blockers and advisories remain visible."
      x-authorization: open-development-only
      responses:
        "200":
          description: Four stage results or not_evaluated without implying readiness.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiReadiness"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/completion:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardCompletion
      tags: [webinars]
      description: Development-only last immutable completion result; planning and complete evaluator coverage are not operational evidence.
      x-authorization: open-development-only
      responses:
        "200":
          description: Completion result, missing inputs and evidence references or not_evaluated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiCompletion"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/evidence:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardEvidence
      tags: [webinars]
      description: Development-only immutable evidence references, not approved proof of execution.
      x-authorization: open-development-only
      responses:
        "200":
          description: Scoped unverified evidence references.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiEvidenceList"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
    post:
      operationId: submitWebinarStandardEvidence
      tags: [webinars]
      description: "Development-only immutable unverified source reference. Caller supplies exact sourceType/sourceVersion/sourceHash of the available scoped immutable source, not just its ID. Mismatch or later observations fail closed as STALE_INPUT. Governed source receipts must remain valid. Result is always unknown. Same scoped idempotency key and request replays; different input conflicts. Does not pass rules or create exceptions."
      x-authorization: open-development-only; server-derived unverified actor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarApiEvidenceInput"}
      responses:
        "201":
          description: Appended evidence or replay of the same immutable record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiEvidenceCreated"}
              example:
                id: 11ebd7f4-20c3-4a68-85f1-bb06fe3b2844
                revision: 6
                sourceId: 119a1ae8-43da-4593-8060-f039e5d69605
                sourceType: occurrence
                sourceVersion: "1.0-pilot-rc1"
                sourceHash: "d54e3545f77a346cae96b09b6b48abe42f72b8a3fb848120b5859cce06cbdc49"
                evidenceType: source-observation
                result: unknown
                authenticated: false
                unverified: true
                operational: false
                replayed: false
                recordedAt: "2026-09-24T12:00:01.000Z"
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
        "413": {$ref: "#/components/responses/WebinarApiValidationError"}
        "422": {$ref: "#/components/responses/WebinarApiIncomplete"}
        "503": {$ref: "#/components/responses/WebinarApiUnavailable"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/exceptions:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardExceptions
      tags: [webinars]
      description: Development-only requests remain unverified drafts; no exception decision is available.
      x-authorization: open-development-only
      responses:
        "200":
          description: Scoped draft requests; none resolves a blocker.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiExceptionList"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
    post:
      operationId: requestWebinarStandardException
      tags: [webinars]
      description: "Development-only draft. Requires a failed blocking exception-eligible rule and evidence included in current snapshot. WEB-EXC-001 cannot exempt itself. Advisory lock/revision and scoped idempotency protect concurrent requests. No approval or readiness override."
      x-authorization: open-development-only; server-derived unverified actor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarApiExceptionInput"}
      responses:
        "201":
          description: Immutable unauthenticated draft, never a reviewer decision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiExceptionCreated"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
        "413": {$ref: "#/components/responses/WebinarApiValidationError"}
        "422": {$ref: "#/components/responses/WebinarApiIncomplete"}
        "503": {$ref: "#/components/responses/WebinarApiUnavailable"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/exceptions/{exceptionId}/review:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
      - {name: exceptionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reviewWebinarStandardException
      tags: [webinars]
      description: "Development-only stable denial contract. Trusted reviewer identity/authorization unavailable. Never approves, denies, revokes or mutates; client-supplied name, header, email and role are not authentication."
      x-authorization: unavailable-until-independent-trusted-reviewer-identity
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebinarApiEmptyReview"}
      responses:
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "403": {$ref: "#/components/responses/WebinarApiUnauthorized"}
  /campaigns/{campaignId}/webinars/{sessionId}/standard/history:
    parameters:
      - {$ref: "#/components/parameters/WebinarApiCampaignId"}
      - {$ref: "#/components/parameters/WebinarApiSessionId"}
    get:
      operationId: getWebinarStandardHistory
      tags: [webinars]
      description: "Development-only immutable occurrence history ordered by revision; keyset pagination. Only simulation-safe source metadata, no stored provider payloads. Historical snapshots may have no stable engine release identity."
      x-authorization: open-development-only
      parameters:
        - {name: afterRevision, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Bounded immutable history page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebinarApiHistory"}
        "400": {$ref: "#/components/responses/WebinarApiValidationError"}
        "404": {$ref: "#/components/responses/WebinarApiNotFound"}
        "409": {$ref: "#/components/responses/WebinarApiConflict"}
  /development/status:
    get:
      operationId: getDevelopmentStatus
      responses:
        "200":
          description: Server-selected access mode; never an identity assertion.
          content:
            application/json:
              schema:
                type: object
                required: [mode, planningAccess, unverified, operationalActionsEnabled]
                properties:
                  mode: {type: string, enum: [restricted, open-development]}
                  planningAccess: {type: boolean}
                  unverified: {type: boolean, enum: [true]}
                  operationalActionsEnabled: {type: boolean, enum: [false]}
  /development/groups:
    get:
      operationId: getDevelopmentGroups
      parameters:
        - {$ref: "#/components/parameters/PageLimit"}
        - {$ref: "#/components/parameters/PageOffset"}
      responses:
        "200":
          description: Development teams, groups and unverified profile references; no memberships.
          headers:
            X-Pagination: {$ref: "#/components/headers/PopulationPage"}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    post:
      operationId: createDevelopmentGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DevelopmentGroupInput"}
      responses:
        "201":
          description: Created unverified development organization unit.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /development/ownership/{type}/{id}:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string, enum: [campaigns, activities]}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getDevelopmentOwnership
      responses:
        "200":
          description: Stable ownership associations with unverified attribution.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      operationId: updateDevelopmentOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DevelopmentOwnershipInput"}
      responses:
        "200":
          description: Planning association changed; creator remains separate and unverified.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /development/calendar:
    get:
      operationId: getDevelopmentCalendar
      parameters:
        - {name: groupId, in: query, schema: {type: string, format: uuid}}
        - {name: campaignId, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        "200":
          description: Stable activity-ID keyset page, filtered before counting. Live population; refresh from the first page to include newly inserted IDs preceding the cursor.
          content:
            application/json:
              schema:
                type: object
                required: [entries, total, returned, hasMore, nextCursor]
                properties:
                  entries: {type: array, items: {type: object, additionalProperties: true}}
                  total: {type: integer}
                  returned: {type: integer}
                  hasMore: {type: boolean}
                  nextCursor: {type: [string, "null"]}
                  unverified: {type: boolean}
                  authoritative: {type: boolean}
  /development/foundation/observations:
    get:
      operationId: inspectDevelopmentFoundationObservations
      description: Read-only synthetic occurrence inspection. No provider call, no operational authority.
      parameters:
        - {name: campaignId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: activityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: occurrenceId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Governed observation inspection; connector reachability is not asserted by this read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevelopmentFoundationInspection"}
        "400": {description: Invalid scope}
        "404": {description: Scope not found}
        "409": {description: Not an eligible synthetic occurrence}
  /development/foundation/observations/refresh:
    post:
      operationId: refreshDevelopmentFoundationObservations
      description: Server-only synthetic contract refresh; disabled without explicitly registered server fixture. Never accepts governed output.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DevelopmentFoundationRefresh"}
      responses:
        "200":
          description: Full immutable simulation snapshot and synthetic inspection, not production Foundation connectivity
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevelopmentFoundationRefreshResult"}
        "400": {description: Invalid fixed request tuple}
        "404": {description: Scope not found}
        "409": {description: "Provider absent, ineligible scope or revision conflict"}
  /development/simulations/context:
    get:
      operationId: getDevelopmentSimulationContext
      description: Read-only scoped preflight for explicitly opted-in synthetic occurrences; does not evaluate, mutate or infer eligibility from template version.
      parameters:
        - {name: campaignId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: activityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: occurrenceId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Exact standard and current source revision for preparing a new fixed retry tuple.
          content:
            application/json:
              schema:
                type: object
                required: [expectedRevision, standard, operationalStatus, unverified, authoritative]
                properties:
                  expectedRevision: {type: integer, minimum: 0}
                  standard:
                    type: object
                    required: [id, version]
                    properties:
                      id: {type: string}
                      version: {type: string}
                  operationalStatus: {type: string, enum: [simulation-only]}
                  unverified: {type: boolean}
                  authoritative: {type: boolean}
        "404":
          description: No synthetic occurrence in requested campaign/activity scope
        "409":
          description: Occurrence not explicitly eligible for the exact standard
  /development/simulations:
    post:
      operationId: simulateDevelopmentWorkflow
      description: Open-development only. Eligible explicitly opted-in new synthetic webinar occurrences invoke the internal standards orchestrator. Webinar caller must submit a fixed calculationAt/idempotencyKey/expectedRevision tuple and retain it unchanged for retries; a new calculation needs a new tuple. Generic non-webinar preview retains its prior optional request shape. Neither legacy_9 nor default_5 template version proves eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DevelopmentSimulationInput"}
      responses:
        "200":
          description: Simulation-only structured webinar result or clearly differentiated generic preview; never approval, evidence or operational authority.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevelopmentSimulationResult"}
        "400":
          description: Invalid or incomplete selection, including a webinar activity without an occurrence
        "404":
          description: Selected campaign, activity or occurrence not found in scope
        "409":
          description: Ineligible occurrence or stale revision; drafts remain unchanged
  /development/participants/context:
    get:
      operationId: getSyntheticParticipantContext
      description: Open-development only; exact-standard synthetic occurrence, no customer data.
      parameters:
        - {$ref: "#/components/parameters/SyntheticCampaignId"}
        - {$ref: "#/components/parameters/SyntheticActivityId"}
        - {$ref: "#/components/parameters/SyntheticSessionId"}
      responses:
        "200":
          description: Current source revision, occurrence state and available synthetic audience branches.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticParticipantContext"}
        "404": {description: Occurrence outside synthetic scope}
        "409": {description: Ineligible or legacy occurrence}
  /development/participants/fixtures:
    get:
      operationId: listSyntheticParticipantFixtures
      parameters:
        - {$ref: "#/components/parameters/SyntheticCampaignId"}
        - {$ref: "#/components/parameters/SyntheticActivityId"}
        - {$ref: "#/components/parameters/SyntheticSessionId"}
        - {$ref: "#/components/parameters/SyntheticLimit"}
        - {$ref: "#/components/parameters/SyntheticOffset"}
        - {$ref: "#/components/parameters/SyntheticFixtureAfter"}
        - {$ref: "#/components/parameters/SyntheticAudienceBranchId"}
      responses:
        "200":
          description: Paginated labelled synthetic fixtures (not customer records).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticFixturePage"}
    post:
      operationId: createSyntheticParticipantFixture
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyntheticFixtureInput"}
      responses:
        "201":
          description: Deterministic closed-key fixture; actor is assigned by the server.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticFixtureCreated"}
        "400": {description: Invalid or PII-bearing request}
        "409": {description: Stale revision or invalid fixture configuration}
  /development/participants/population:
    get:
      operationId: listSyntheticParticipantPopulation
      parameters:
        - {$ref: "#/components/parameters/SyntheticCampaignId"}
        - {$ref: "#/components/parameters/SyntheticActivityId"}
        - {$ref: "#/components/parameters/SyntheticSessionId"}
        - {$ref: "#/components/parameters/SyntheticLimit"}
        - {$ref: "#/components/parameters/SyntheticOffset"}
        - {$ref: "#/components/parameters/SyntheticPersonAfter"}
        - {$ref: "#/components/parameters/SyntheticAudienceBranchId"}
      responses:
        "200":
          description: Canonical participant plan with explicit total and page boundaries; no sending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticPopulationPage"}
  /development/participants/suppression:
    get:
      operationId: inspectSyntheticParticipantSuppression
      parameters:
        - {$ref: "#/components/parameters/SyntheticCampaignId"}
        - {$ref: "#/components/parameters/SyntheticActivityId"}
        - {$ref: "#/components/parameters/SyntheticSessionId"}
        - {$ref: "#/components/parameters/SyntheticAudienceBranchId"}
        - {name: personId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: kind, in: query, required: true, schema: {$ref: "#/components/schemas/SyntheticCommunicationKind"}}
        - {name: calculationAt, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Fail-closed simulation-only suppression decision, never a handoff authorization.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticSuppressionDecision"}
  /development/participants/history:
    get:
      operationId: getSyntheticParticipantHistory
      description: Immutable synthetic source events, obligation changes and snapshot references; occurrence and fixture scoped.
      parameters:
        - {$ref: "#/components/parameters/SyntheticCampaignId"}
        - {$ref: "#/components/parameters/SyntheticActivityId"}
        - {$ref: "#/components/parameters/SyntheticSessionId"}
        - {name: personId, in: query, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/SyntheticLimit"}
        - {$ref: "#/components/parameters/SyntheticOffset"}
        - {$ref: "#/components/parameters/SyntheticAudienceBranchId"}
      responses:
        "200":
          description: Paginated source history, not mutable participant administration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticHistoryPage"}
        "404": {description: Synthetic fixture outside requested campaign}
  /development/participants/transitions:
    post:
      operationId: transitionSyntheticParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyntheticTransitionInput"}
      responses:
        "200":
          description: Audited transition and immutable simulation snapshot, including before/after obligations.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyntheticTransitionResult"}
        "400": {description: Invalid source event or unsupported action}
        "404": {description: Occurrence outside synthetic scope}
        "409": {description: Invalid transition or optimistic concurrency conflict; retain draft and retry tuple}
  /activity-model/catalog:
    get:
      operationId: getActivityModelCatalog
      tags: [governance]
      responses:
        "200":
          description: Canonical governed channel and activity-type catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityModelCatalog"}
  /activity-model/render-name:
    post:
      operationId: renderActivityModelName
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityNameRenderInput"}
      responses:
        "200":
          description: Exact rendered activity name
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityNameRenderResponse"}
  /task-defaults:
    get:
      operationId: getTaskDefaults
      responses:
        "200":
          description: Configurable task offsets
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/TaskDefault"}}
    patch:
      operationId: updateTaskDefaults
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskDefaultsUpdate"}
      responses:
        "200":
          description: Updated offsets
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/TaskDefault"}}
  /owner-capacities:
    get:
      operationId: getOwnerCapacities
      responses:
        "200":
          description: Global capacity, configurable default ceiling 10
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OwnerCapacity"}}
    patch:
      operationId: updateOwnerCapacities
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OwnerCapacitiesUpdate"}
      responses:
        "200":
          description: Updated capacities
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OwnerCapacity"}}
  /campaigns/{id}/activities/{activityId}/task-settings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: activityId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getActivityTaskSettings
      responses:
        "200":
          description: Parent scheduling anchors and informational tier
