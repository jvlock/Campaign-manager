      type: object
      required: [input, version, versionId, resolved, chain]
      properties:
        input: {type: string}
        version: {type: string}
        versionId: {type: string, format: uuid}
        resolved: {$ref: "#/components/schemas/TaxonomyTerm"}
        chain:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyTerm"}
