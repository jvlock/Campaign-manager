        subject: {type: string}
        preheader: {type: string}
        hero: {type: string}
        body: {type: string}
        ctaLabel: {type: string}
        ctaUrl: {type: string}
        internalAssetName: {type: string}
    WebinarStandardVariant:
      type: object
