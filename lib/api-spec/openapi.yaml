      type: object
      required: [error, errors]
      properties:
        error: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [key, slot, field, message]
            properties:
              key: {type: string}
              slot: {type: integer}
              field: {type: string}
              message: {type: string}
