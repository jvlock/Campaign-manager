        unit: {type: string, enum: [instant, days, hours]}
        direction: {type: string, enum: [trigger, before, after]}
        weekendAdjustment: {type: string}
        locked: {type: boolean, const: true}
    WebinarStandardScheduled:
      type: object
      required: [status, originalAt, currentAt, effectiveAt, skipReason]
      properties:
        status: {type: string}
        originalAt: {type: [string, "null"], format: date-time}
        currentAt: {type: [string, "null"], format: date-time}
        effectiveAt: {type: [string, "null"], format: date-time}
        skipReason: {type: [string, "null"]}
    WebinarStandardCommunication:
      type: object
      required: [id, key, name, sortOrder, status, timing, scheduled, audienceRule, variants]
      properties:
        id: {type: string, format: uuid}
        key:
          type: string
          enum: [registration_confirmation, recruitment_1, recruitment_2, recruitment_3, final_recruitment, registered_reminder, final_reminder, attendee_followup, no_show_followup]
        name: {type: string}
        sortOrder: {type: integer}
        status: {type: string}
        timing: {$ref: "#/components/schemas/WebinarStandardTiming"}
        scheduled: {$ref: "#/components/schemas/WebinarStandardScheduled"}
        audienceRule: {type: string}
        originalDate: {type: [string, "null"], format: date}
        currentDate: {type: [string, "null"], format: date}
        effectiveDate: {type: [string, "null"], format: date}
        variants:
          type: array
          items: {$ref: "#/components/schemas/WebinarStandardVariantContent"}
    WebinarStandardTemplateConfig:
      type: object
      required: [pilotLimits, variants]
      properties:
        pilotLimits:
          type: object
          required: [subject, preheader, hero, body, ctaLabel, ctaUrl, internalAssetName]
          properties:
            subject: {type: integer, minimum: 1, default: 50}
            preheader: {type: integer, minimum: 1, default: 90}
            hero: {type: integer, minimum: 1, default: 60}
            body: {type: integer, minimum: 1, default: 1200}
            ctaLabel: {type: integer, minimum: 1, default: 25}
            ctaUrl: {type: integer, minimum: 1, default: 2000}
            internalAssetName: {type: integer, minimum: 1, default: 120}
        variants:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/WebinarStandardVariant"}
    WebinarStandard:
      type: object
      required: [campaignId, sessionId, activityId, launchAt, templateConfig, communications]
      properties:
        campaignId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        activityId: {type: string, format: uuid}
        launchAt: {type: [string, "null"], format: date-time}
        templateConfig: {$ref: "#/components/schemas/WebinarStandardTemplateConfig"}
        communications:
          type: array
          minItems: 9
          maxItems: 9
          items: {$ref: "#/components/schemas/WebinarStandardCommunication"}
    WebinarStandardContentPatch:
      type: object
      properties:
        subject: {type: string}
        preheader: {type: string}
        hero: {type: string}
        body: {type: string}
        ctaLabel: {type: string}
        ctaUrl: {type: string}
        internalAssetName: {type: string}
    WebinarStandardPatch:
      type: object
      properties:
        launchAt: {type: string, format: date-time}
        templateConfig:
          type: object
          properties:
            pilotLimits: {$ref: "#/components/schemas/WebinarStandardTemplateConfig/properties/pilotLimits"}
            variants:
              type: array
              minItems: 1
              maxItems: 4
              items: {$ref: "#/components/schemas/WebinarStandardVariant"}
        communications:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key: {type: string}
              status: {type: string}
              timing: {type: object, description: Rejected; standard timing is locked}
              variants:
                type: array
                items:
                  type: object
                  required: [slot, content]
                  properties:
                    slot: {type: integer, minimum: 1, maximum: 4}
                    content: {$ref: "#/components/schemas/WebinarStandardContentPatch"}
